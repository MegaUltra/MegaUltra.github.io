<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مگا لانچر - در حال بروزرسانی</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #d0d0d0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
            overflow: hidden;
            background-image: radial-gradient(circle at 20% 30%, rgba(0, 200, 50, 0.06) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(0, 255, 100, 0.04) 0%, transparent 50%);
        }

        /* ===== SPLASH SCREEN (صفحه ورود) ===== */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            background-image: radial-gradient(circle at 50% 40%, rgba(0, 200, 50, 0.08) 0%, transparent 60%);
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-content {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .splash-logo {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00e676, #00c853);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .splash-logo span {
            font-size: 1.2rem;
            background: rgba(0, 200, 80, 0.15);
            padding: 0.2rem 1rem;
            border-radius: 40px;
            color: #00e676;
            font-weight: 500;
            margin-right: 8px;
        }

        .splash-subtitle {
            color: #6a6a6a;
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid rgba(0, 255, 100, 0.06);
            padding-bottom: 1.5rem;
        }

        /* دکمه ورود با استایل سبز */
        .enter-btn {
            display: inline-block;
            padding: 1rem 3.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: #0a0a0a;
            background: linear-gradient(135deg, #00e676, #00b33c);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 200, 80, 0.25);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .enter-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(0, 200, 80, 0.35);
        }

        .enter-btn:active {
            transform: scale(0.95);
        }

        .enter-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg) translateX(-100%);
            transition: 0.6s;
        }

        .enter-btn:hover::after {
            transform: rotate(45deg) translateX(100%);
        }

        .enter-icon {
            display: inline-block;
            margin-right: 10px;
            font-size: 1.4rem;
        }

        /* ===== MAIN PAGE (صفحه اصلی) ===== */
        .maintenance-card {
            max-width: 680px;
            width: 100%;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2.8rem 2.5rem;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(0, 255, 100, 0.15);
            border: 1px solid rgba(0, 200, 80, 0.25);
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .maintenance-card.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Subtle green glow */
        .maintenance-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg at 50% 50%, rgba(0, 200, 50, 0.03), rgba(0, 255, 100, 0.03), rgba(0, 200, 50, 0.03));
            animation: rotateGlow 25s linear infinite;
            z-index: 0;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .content {
            position: relative;
            z-index: 1;
        }

        .logo-icon {
            display: inline-block;
            margin-bottom: 1.8rem;
            background: linear-gradient(135deg, #00b33c, #00cc66);
            padding: 0.8rem 1.5rem;
            border-radius: 100px;
            box-shadow: 0 8px 25px rgba(0, 200, 80, 0.25);
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #0a0a0a;
            text-shadow: 0 1px 5px rgba(0, 255, 100, 0.2);
        }

        .logo-icon span {
            background: rgba(0, 0, 0, 0.25);
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-size: 0.9rem;
            margin-right: 8px;
            font-weight: 500;
            color: #e0e0e0;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            background: linear-gradient(135deg, #00e676, #00c853);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.3;
        }

        .status-message {
            background: rgba(0, 255, 100, 0.04);
            border-radius: 1.5rem;
            padding: 1.8rem 1.5rem;
            margin: 2rem 0 2.2rem 0;
            border: 1px solid rgba(0, 255, 100, 0.08);
        }

        .status-message p {
            font-size: 1.15rem;
            line-height: 1.9;
            color: #c0c0c0;
            font-weight: 400;
        }

        .status-message strong {
            color: #00e676;
            font-weight: 600;
        }

        .support-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 1.2rem;
            padding: 1.5rem 1.2rem;
            margin-top: 1.5rem;
            border: 1px solid rgba(0, 255, 100, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
        }

        .support-label {
            color: #8a8a8a;
            font-size: 0.95rem;
        }

        .support-telegram {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #0f1f0f, #0a0f0a);
            padding: 0.6rem 1.4rem;
            border-radius: 60px;
            text-decoration: none;
            color: #e0e0e0;
            font-weight: 500;
            border: 1px solid rgba(0, 200, 80, 0.3);
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .support-telegram:hover {
            background: linear-gradient(135deg, #1a2a1a, #0f1a0f);
            border-color: #00e676;
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(0, 200, 80, 0.15);
        }

        .telegram-icon {
            display: inline-block;
            background: #00b33c;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            color: #0a0a0a;
            text-align: center;
            line-height: 28px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0, 200, 80, 0.2);
        }

        .loading-dots {
            display: inline-flex;
            gap: 6px;
            margin-top: 0.5rem;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            background: #00e676;
            border-radius: 50%;
            display: inline-block;
            animation: pulseDot 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        .loading-dots span:nth-child(3) { animation-delay: 0; }

        @keyframes pulseDot {
            0%, 80%, 100% { transform: scale(0.4); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .footer-note {
            margin-top: 1.8rem;
            font-size: 0.8rem;
            color: #3a3a3a;
            border-top: 1px solid rgba(0, 255, 100, 0.04);
            padding-top: 1.2rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .maintenance-card {
                padding: 1.8rem 1.2rem;
                border-radius: 1.5rem;
            }
            h1 {
                font-size: 1.8rem;
            }
            .status-message p {
                font-size: 1rem;
            }
            .logo-icon {
                font-size: 1.4rem;
                padding: 0.5rem 1.2rem;
            }
            .support-box {
                flex-direction: column;
                align-items: center;
            }
            .splash-logo {
                font-size: 2.2rem;
            }
            .enter-btn {
                padding: 0.8rem 2.5rem;
                font-size: 1rem;
            }
        }

        /* ===== AUDIO ===== */
        #bg-music {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ===== AUDIO PLAYER ===== -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://cdn.imgurl.ir/uploads/u795985_.mp3" type="audio/mpeg">
        مرورگر شما از پخش صوت پشتیبانی نمی‌کند.
    </audio>

    <!-- ===== SPLASH SCREEN (صفحه ورود) ===== -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">
                MEGA<span>Launcher</span>
            </div>
            <div class="splash-subtitle">
                بزرگترین و بهینه‌ترین لانچر ماینکرفت ایران
            </div>
            <button class="enter-btn" id="enterBtn">
                <span class="enter-icon">▶</span>
                ورود به سایت
            </button>
            <div style="margin-top: 2rem; font-size: 0.8rem; color: #3a3a3a;">
                با ورود، موسیقی پس‌زمینه شروع به پخش می‌کند
            </div>
        </div>
    </div>

    <!-- ===== MAIN PAGE ===== -->
    <div class="maintenance-card" id="mainPage">
        <div class="content">

            <div class="logo-icon">
                MEGA<span>Launcher</span>
            </div>

            <h1>در حال بروزرسانی</h1>

            <div class="status-message">
                <p>
                    سایت جهت انجام <strong>بروزرسانی</strong> از دسترس خارج شده است.<br>
                    لطفاً <strong>شکیبا</strong> باشید.<br>
                    با تشکر
                </p>
                <div class="loading-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <div class="support-box">
                <span class="support-label">📞 پشتیبانی:</span>
                <a href="https://t.me/DachAshkan" target="_blank" class="support-telegram">
                    <span class="telegram-icon">✈</span>
                    @DachAshkan
                </a>
            </div>

            <div class="footer-note">
                مگا لانچر • بزرگترین و بهینه‌ترین لانچر ماینکرفت ایران
            </div>

        </div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const splashScreen = document.getElementById('splash-screen');
            const mainPage = document.getElementById('mainPage');
            const enterBtn = document.getElementById('enterBtn');
            const audio = document.getElementById('bg-music');
            let musicStarted = false;

            // تابع برای ورود به سایت
            function enterSite() {
                // مخفی کردن صفحه اسپلش
                splashScreen.classList.add('hidden');

                // نمایش صفحه اصلی با انیمیشن
                mainPage.classList.add('visible');

                // پخش موسیقی
                if (!musicStarted) {
                    audio.play().then(() => {
                        musicStarted = true;
                        console.log('موسیقی شروع به پخش کرد');
                    }).catch(error => {
                        console.log('خطا در پخش موسیقی:', error);
                        // اگر خطا بود، یک بار دیگر تلاش می‌کنیم
                        setTimeout(() => {
                            audio.play().catch(() => {});
                        }, 500);
                    });
                }
            }

            // رویداد کلیک روی دکمه ورود
            enterBtn.addEventListener('click', enterSite);

            // همچنین اگر کاربر روی هر جای صفحه اسپلش کلیک کرد (به جز دکمه) ورود انجام شود
            splashScreen.addEventListener('click', function(e) {
                // اگر روی خود دکمه کلیک نشده بود
                if (e.target !== enterBtn && !enterBtn.contains(e.target)) {
                    enterSite();
                }
            });

            // پشتیبانی از کلید Enter برای دسترسی‌پذیری
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !splashScreen.classList.contains('hidden')) {
                    enterSite();
                }
            });

            // پیش‌بارگذاری موسیقی برای شروع سریع‌تر
            audio.load();
        });
    </script>

</body>
</html>
