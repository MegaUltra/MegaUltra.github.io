<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEGALUNCHER | بهترین لانچر ماینکرفت</title>

    <style>

        /* =========================================
           FONTS
        ========================================= */

        @font-face {
            font-family: "V1";
            src: url("./fonts/Vazirmatn-Black.ttf") format("truetype");
        }

        @font-face {
            font-family: "V2";
            src: url("./fonts/Vazirmatn-Regular.ttf") format("truetype");
        }

        @font-face {
            font-family: "V3";
            src: url("./fonts/Vazirmatn-Light.ttf") format("truetype");
        }

        @font-face {
            font-family: "V4";
            src: url("./fonts/Vazirmatn-SemiBold.ttf") format("truetype");
        }



        /* =========================================
           ROOT
        ========================================= */

        :root {
            --main: #d7afb2;
            --main-dark: #b88a8e;
            --bg: #000000;
            --text: #f5ecec;
            --muted: #b09a9b;
        }



        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }



        /* =========================================
           BODY
        ========================================= */

        body {
            min-height: 100vh;

            overflow-x: hidden;

            background-color: #000000;

            color: var(--text);

            font-family: "V2", Tahoma, Arial, sans-serif;

            position: relative;
        }



        /* =========================================
           ANIMATED BACKGROUND
        ========================================= */

        body::before {
            content: "";

            position: fixed;

            inset: 0;

            z-index: -1;

            background-image: url("files/bgg.png");

            background-position: center center;

            background-repeat: no-repeat;

            background-size: cover;

            opacity: 0.40;

            animation: backgroundPulse 5s ease-in-out infinite;

            pointer-events: none;
        }


        @keyframes backgroundPulse {

            0% {
                opacity: 0.40;
            }

            50% {
                opacity: 0.52;
            }

            100% {
                opacity: 0.40;
            }

        }



        /* =========================================
           NAVBAR
        ========================================= */

        .navbar {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 20;

            height: 76px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 6%;

            background: rgba(0, 0, 0, .7);

            backdrop-filter: blur(18px);

            border-bottom: 1px solid rgba(215, 175, 178, .08);
        }



        /* =========================================
           NAV LEFT
        ========================================= */

        .nav-left {
            display: flex;

            gap: 28px;

            align-items: center;

            flex: 1;

            justify-content: flex-end;
        }


        .nav-left a {
            color: #b09a9b;

            text-decoration: none;

            font-size: 14px;

            font-family: "V1", Tahoma, Arial, sans-serif;

            font-weight: 500;

            transition: .3s ease;

            padding: 8px 16px;

            border-radius: 10px;
        }


        .nav-left a:hover {
            color: #1a0f10;

            background: #ffffff;

            box-shadow: 0 0 25px rgba(215, 175, 178, .2);
        }



        /* =========================================
           NAV CENTER
        ========================================= */

        .nav-center {
            display: flex;

            justify-content: center;

            flex: 0 1 auto;

            margin: 0 10px;
        }


        .btn-home {
            padding: 8px 24px;

            border-radius: 10px;

            background: #ffffff;

            border: 1px solid rgba(215, 175, 178, .3);

            color: #1a0f10;

            font-family: "V2", Tahoma, Arial, sans-serif;

            font-size: 14px;

            font-weight: 700;

            text-decoration: none;

            transition: .3s ease;

            box-shadow: 0 0 20px rgba(215, 175, 178, .1);
        }


        .btn-home:hover {
            box-shadow: 0 0 35px rgba(215, 175, 178, .25);

            background: #f5f0f0;

            transform: translateY(-1px);
        }



        /* =========================================
           NAV RIGHT
        ========================================= */

        .nav-right {
            display: flex;

            gap: 28px;

            align-items: center;

            flex: 1;

            justify-content: flex-start;
        }


        .nav-right a {
            color: #b09a9b;

            text-decoration: none;

            font-size: 14px;

            font-family: "V1", Tahoma, Arial, sans-serif;

            font-weight: 500;

            transition: .3s ease;

            padding: 8px 16px;

            border-radius: 10px;
        }


        .nav-right a:hover {
            color: #1a0f10;

            background: #ffffff;

            box-shadow: 0 0 25px rgba(215, 175, 178, .2);
        }



        /* =========================================
           HERO
        ========================================= */

        .hero {
            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 125px 20px 200px;

            position: relative;

            z-index: 1;
        }


        .hero-content {
            max-width: 920px;

            animation: heroIn .9s ease both;
        }


        @keyframes heroIn {

            from {
                opacity: 0;

                transform: translateY(25px);
            }

            to {
                opacity: 1;

                transform: translateY(0);
            }

        }



        /* =========================================
           TITLE
        ========================================= */

        .hero h1 {
            font-size: 60px;

            font-weight: 1500;

            letter-spacing: 50;

            margin-bottom: 30px;

            font-family: "V1";
        }



        /* =========================================
           SUB TITLE
        ========================================= */

        .sub-slogan {
            color: #b88a8e;

            font-size: 18px;

            margin-bottom: 0;

            font-family: "V2", Tahoma, Arial, sans-serif;

            transform: translateY(-25px);
        }



        /* =========================================
           HERO BUTTONS
        ========================================= */

        .hero-buttons {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 14px;

            margin-top: 5px;
        }


        .hero-btn {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            width: 250px;

            padding: 13px 25px;

            border-radius: 12px;

            text-decoration: none;

            font-family: "V1";

            font-size: 17px;

            font-weight: 600;

            transition: .3s ease;
        }



        /* =========================================
           WHITE BUTTON
        ========================================= */

        .hero-btn.primary {
            background: #ffffff;

            color: #000000;
        }


        .hero-btn.primary:hover {
            background: #f5f0f0;

            box-shadow: 0 8px 30px rgba(255, 255, 255, .15);
        }



        /* =========================================
           PINK BUTTON
        ========================================= */

        .hero-btn.secondary {
            background: #d7afb2;

            color: #1a0f10;

            box-shadow: 0 0 25px rgba(215, 175, 178, .15);
        }


        .hero-btn.secondary:hover {
            background: #b88a8e;

            box-shadow: 0 8px 35px rgba(215, 175, 178, .25);
        }



        .bottom-box {
            position: relative;

            width: 100%;

            margin: 20px auto 40px;

            padding: 35px 40px;
                        top: -350px;


            height: 1000px;
            border-top: #b88a8e5e 1px solid;

            background: #000000;


            z-index: 5;
        }


        .bottom-box::before {
            content: "";

            position: absolute;


            left: 15%;

            right: 15%;

            height: 1px;

        }




        @media (max-width: 700px) {

            .navbar {
                padding: 0 3%;

                height: 68px;
            }


            .nav-left,
            .nav-right {
                gap: 4px;
            }


            .nav-left a,
            .nav-right a {
                font-size: 11px;

                padding: 7px 8px;
            }


            .btn-home {
                padding: 8px 13px;

                font-size: 11px;
            }


            .hero {
                padding-bottom: 150px;
            }


            .hero h1 {
                font-size: 38px;

                line-height: 1.2;
            }


            .sub-slogan {
                font-size: 13px;

                line-height: 2;

                padding: 0 15px;
            }


            .hero-buttons {
                gap: 10px;
            }


            .hero-btn {
                min-width: 135px;

                width: 135px;

                padding: 12px 18px;

                font-size: 12px;
            }


            .bottom-box {
                width: 92%;

                padding: 25px 20px;

                min-height: 150px;

                margin-bottom: 25px;

                border-radius: 18px;
            }


            .bottom-box-title {
                font-size: 18px;
            }


            .bottom-box-text {
                font-size: 12px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================================
         BACKGROUND OVERLAY
    ========================================= -->

    <div class="footer-fade"></div>



    <!-- =========================================
         NAVBAR
    ========================================= -->

    <header class="navbar">


        <div class="nav-left">

            <a href="#">
                فروشگاه
            </a>

            <a href="#">
                دانلود لانچر
            </a>

        </div>



        <div class="nav-center">

            <a href="#" class="btn-home">
                صفحه اصلی
            </a>

        </div>



        <div class="nav-right">

            <a href="#">
                حمایت مالی
            </a>

            <a href="#">
                درباره ما
            </a>

        </div>


    </header>



    <!-- =========================================
         HERO
    ========================================= -->

    <main>

        <section class="hero" id="home">

            <div class="hero-content">


                <h1>
                    بزرگترین و بهینه‌ترین لانچر ایران
                </h1>



                <div class="slogan">
                </div>



                <div class="sub-slogan">
                    اولین و بهترین لانچر ماینکرفت در ایران , بهترین تجربه رو ببر!
                </div>



                <div class="hero-buttons">


                    <a href="#" class="hero-btn primary">
                        دانلود لانچر
                    </a>



                    <a href="#" class="hero-btn secondary">
                        ورود به فروشگاه
                    </a>


                </div>


            </div>

        </section>



        <!-- =========================================
             BOTTOM BOX
        ========================================= -->

        <section class="bottom-box">



    </main>


</body>
</html>
