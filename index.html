<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مگا لانچر - در حال بروزرسانی</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #060606;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 100, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 200, 80, 0.03) 0%, transparent 50%),
                repeating-linear-gradient(45deg, rgba(0,255,100,0.01) 0px, rgba(0,255,100,0.01) 2px, transparent 2px, transparent 8px);
        }

        /* ===== SPLASH SCREEN ===== */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #060606;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), 
                        visibility 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            background-image: 
                radial-gradient(circle at 50% 40%, rgba(0, 255, 100, 0.06) 0%, transparent 60%),
                radial-gradient(circle at 80% 20%, rgba(0, 200, 80, 0.03) 0%, transparent 40%);
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(1.05);
        }

        .splash-content {
            text-align: center;
            max-width: 550px;
            padding: 2rem;
            animation: fadeInUp 1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        /* افکت حلقه‌های نئونی */
        .splash-content::before {
            content: '';
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background: 
                conic-gradient(from 0deg at 50% 50%, 
                    transparent 0deg, 
                    rgba(0, 255, 100, 0.03) 60deg, 
                    transparent 120deg,
                    rgba(0, 255, 100, 0.03) 180deg,
                    transparent 240deg,
                    rgba(0, 255, 100, 0.03) 300deg,
                    transparent 360deg);
            border-radius: 50%;
            animation: rotateGlow 10s linear infinite;
            z-index: -1;
            filter: blur(20px);
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1.2); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== LOGO (متنی) ===== */
        .splash-logo-text {
            width: 130px;
            height: 130px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ff88, #00b33c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: #060606;
            box-shadow: 0 0 40px rgba(0, 200, 80, 0.2), inset 0 0 40px rgba(0, 0, 0, 0.1);
            border: 3px solid rgba(0, 255, 100, 0.3);
            animation: logoPulse 3s ease-in-out infinite;
            transition: all 0.5s ease;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            user-select: none;
        }

        .splash-logo-text:hover {
            transform: scale(1.05) rotate(5deg);
            border-color: rgba(0, 255, 100, 0.6);
            box-shadow: 0 0 60px rgba(0, 200, 80, 0.3);
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(0, 200, 80, 0.2), inset 0 0 40px rgba(0, 0, 0, 0.1); }
            50% { box-shadow: 0 0 70px rgba(0, 200, 80, 0.35), inset 0 0 60px rgba(0, 0, 0, 0.05); }
        }

        .splash-title {
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ff88, #00b33c, #00ff88);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientMove 3s ease-in-out infinite;
            letter-spacing: 2px;
            text-shadow: 0 0 40px rgba(0, 255, 100, 0.1);
            margin-bottom: 0.5rem;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .splash-subtitle {
            color: #6a6a6a;
            font-size: 1rem;
            margin-bottom: 2.5rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(0, 255, 100, 0.06);
            padding-bottom: 1.5rem;
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
        }

        /* ===== ENTER BUTTON ===== */
        .enter-btn {
            display: inline-block;
            padding: 1rem 4rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: #060606;
            background: linear-gradient(135deg, #00ff88, #00b33c);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 30px rgba(0, 200, 80, 0.2);
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
        }

        .enter-btn::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, #00ff88, #00b33c, #00ff88);
            background-size: 200% 200%;
            border-radius: 60px;
            z-index: -1;
            animation: gradientMove 3s ease-in-out infinite;
            filter: blur(5px);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .enter-btn:hover::before {
            opacity: 1;
        }

        .enter-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 40px rgba(0, 200, 80, 0.3);
        }

        .enter-btn:active {
            transform: scale(0.95);
        }

        .enter-icon {
            display: inline-block;
            margin-left: 12px;
            font-size: 1.2rem;
            animation: iconBounce 2s ease-in-out infinite;
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(5px); }
        }

        .splash-hint {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #3a3a3a;
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            letter-spacing: 1px;
            opacity: 0.6;
        }

        /* ===== MAIN PAGE ===== */
        .maintenance-card {
            max-width: 680px;
            width: 100%;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            padding: 2.8rem 2.5rem;
            box-shadow: 0 25px 60px -8px rgba(0, 0, 0, 0.9), 
                        0 0 0 1px rgba(0, 255, 100, 0.1),
                        inset 0 0 80px rgba(0, 255, 100, 0.02);
            border: 1px solid rgba(0, 200, 80, 0.15);
            text-align: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: scale(0.95) translateY(20px);
        }

        .maintenance-card.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* افکت‌های نئونی پویا */
        .maintenance-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg at 50% 50%, 
                rgba(0, 255, 100, 0.03), 
                rgba(0, 200, 80, 0.02), 
                rgba(0, 255, 100, 0.03));
            animation: rotateGlow 20s linear infinite;
            z-index: 0;
        }

        /* خطوط شبکه AI */
        .maintenance-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 100, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 100, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        /* لوگو در صفحه اصلی (متنی) */
        .main-logo-text {
            width: 110px;
            height: 110px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ff88, #00b33c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            color: #060606;
            box-shadow: 0 0 30px rgba(0, 200, 80, 0.15), inset 0 0 30px rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(0, 255, 100, 0.2);
            transition: all 0.5s ease;
            user-select: none;
        }

        .main-logo-text:hover {
            transform: rotate(5deg) scale(1.05);
            border-color: rgba(0, 255, 100, 0.5);
            box-shadow: 0 0 50px rgba(0, 200, 80, 0.25);
        }

        h1 {
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            background: linear-gradient(135deg, #00ff88, #00b33c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.3;
            letter-spacing: 2px;
        }

        .status-message {
            background: rgba(0, 255, 100, 0.03);
            border-radius: 1.5rem;
            padding: 1.8rem 1.5rem;
            margin: 2rem 0 2.2rem 0;
            border: 1px solid rgba(0, 255, 100, 0.06);
            backdrop-filter: blur(10px);
        }

        .status-message p {
            font-size: 1.1rem;
            line-height: 2;
            color: #b0b0b0;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .status-message strong {
            color: #00ff88;
            font-weight: 600;
            text-shadow: 0 0 20px rgba(0, 255, 100, 0.1);
        }

        .support-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 1.2rem;
            padding: 1.5rem 1.2rem;
            margin-top: 1.5rem;
            border: 1px solid rgba(0, 255, 100, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            backdrop-filter: blur(10px);
        }

        .support-label {
            color: #8a8a8a;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .support-telegram {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #0f1f0f, #0a0f0a);
            padding: 0.6rem 1.6rem;
            border-radius: 60px;
            text-decoration: none;
            color: #e0e0e0;
            font-weight: 500;
            border: 1px solid rgba(0, 200, 80, 0.2);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .support-telegram:hover {
            background: linear-gradient(135deg, #1a2a1a, #0f1a0f);
            border-color: #00ff88;
            transform: scale(1.02);
            box-shadow: 0 6px 30px rgba(0, 200, 80, 0.15);
        }

        .telegram-icon {
            display: inline-block;
            background: #00b33c;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            color: #0a0a0a;
            text-align: center;
            line-height: 28px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0, 200, 80, 0.2);
        }

        .loading-dots {
            display: inline-flex;
            gap: 8px;
            margin-top: 0.8rem;
        }

        .loading-dots span {
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            display: inline-block;
            animation: pulseDot 1.4s infinite ease-in-out both;
            box-shadow: 0 0 15px rgba(0, 255, 100, 0.2);
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        .loading-dots span:nth-child(3) { animation-delay: 0; }

        @keyframes pulseDot {
            0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        .footer-note {
            margin-top: 1.8rem;
            font-size: 0.7rem;
            color: #3a3a3a;
            border-top: 1px solid rgba(0, 255, 100, 0.04);
            padding-top: 1.2rem;
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            letter-spacing: 1px;
            opacity: 0.5;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 550px) {
            .maintenance-card {
                padding: 1.8rem 1.2rem;
                border-radius: 1.8rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .status-message p {
                font-size: 0.95rem;
            }
            .splash-title {
                font-size: 2rem;
            }
            .splash-logo-text {
                width: 100px;
                height: 100px;
                font-size: 2.8rem;
            }
            .main-logo-text {
                width: 90px;
                height: 90px;
                font-size: 2.5rem;
            }
            .enter-btn {
                padding: 0.8rem 2.5rem;
                font-size: 0.95rem;
            }
            .support-box {
                flex-direction: column;
                align-items: center;
            }
        }

        @media (max-width: 400px) {
            .splash-title {
                font-size: 1.6rem;
            }
            .splash-subtitle {
                font-size: 0.8rem;
                letter-spacing: 1px;
            }
            .splash-logo-text {
                width: 80px;
                height: 80px;
                font-size: 2.2rem;
            }
            .main-logo-text {
                width: 75px;
                height: 75px;
                font-size: 2rem;
            }
            .enter-btn {
                padding: 0.7rem 2rem;
                font-size: 0.85rem;
            }
        }

        /* ===== AUDIO ===== */
        #bg-music {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ===== AUDIO ===== -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://cdn.imgurl.ir/uploads/u795985_.mp3" type="audio/mpeg">
        مرورگر شما از پخش صوت پشتیبانی نمی‌کند.
    </audio>

    <!-- ===== SPLASH SCREEN ===== -->
    <div id="splash-screen">
        <div class="splash-content">
            <!-- لوگوی متنی -->
            <div class="splash-logo-text">M</div>
            <div class="splash-title">MEGA</div>
            <div class="splash-subtitle">Launcher • Next Gen</div>
            <button class="enter-btn" id="enterBtn">
                <span class="enter-icon">▶</span>
                ورود به سایت
            </button>
            <div class="splash-hint">● هوش مصنوعی ● واقعیت مجازی ●</div>
        </div>
    </div>

    <!-- ===== MAIN PAGE ===== -->
    <div class="maintenance-card" id="mainPage">
        <div class="content">

            <!-- لوگوی متنی در صفحه اصلی -->
            <div class="main-logo-text">M</div>

            <h1>در حال بروزرسانی</h1>

            <div class="status-message">
                <p>
                    سایت جهت انجام <strong>بروزرسانی</strong> از دسترس خارج شده است.<br>
                    لطفاً <strong>شکیبا</strong> باشید.<br>
                    با تشکر
                </p>
                <div class="loading-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <div class="support-box">
                <span class="support-label">📞 پشتیبانی:</span>
                <a href="https://t.me/DachAshkan" target="_blank" class="support-telegram">
                    <span class="telegram-icon">✈</span>
                    @DachAshkan
                </a>
            </div>

            <div class="footer-note">
                مگا لانچر • بزرگترین و بهینه‌ترین لانچر ماینکرفت ایران
            </div>

        </div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const splashScreen = document.getElementById('splash-screen');
            const mainPage = document.getElementById('mainPage');
            const enterBtn = document.getElementById('enterBtn');
            const audio = document.getElementById('bg-music');
            let musicStarted = false;

            function enterSite() {
                splashScreen.classList.add('hidden');
                setTimeout(() => {
                    mainPage.classList.add('visible');
                }, 300);

                if (!musicStarted) {
                    audio.play().then(() => {
                        musicStarted = true;
                        console.log('🎵 موسیقی شروع به پخش کرد');
                    }).catch(error => {
                        console.log('⚠️ خطا در پخش:', error);
                        setTimeout(() => audio.play().catch(() => {}), 500);
                    });
                }
            }

            enterBtn.addEventListener('click', enterSite);
            
            splashScreen.addEventListener('click', function(e) {
                if (e.target !== enterBtn && !enterBtn.contains(e.target)) {
                    enterSite();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !splashScreen.classList.contains('hidden')) {
                    enterSite();
                }
            });

            audio.load();
        });
    </script>

</body>
</html>
