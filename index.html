<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بروزرسانی سایت | فانتوم</title>
    
    <!-- فاوآیکون (آیکون تب) -->
    <link rel="icon" type="image/png" href="https://uploadkon.ir/uploads/f34827_26phantom-big.png" />
    <link rel="shortcut icon" href="https://uploadkon.ir/uploads/f34827_26phantom-big.png" type="image/png" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
    <!-- کد گوفتینو (چت) -->
    <script type="text/javascript">
        !function(){var i="Rj5AHD",d=document,g=d.createElement("script"),s="https://www.goftino.com/widget/"+i,l=localStorage.getItem("goftino_"+i);g.type="text/javascript",g.async=!0,g.src=l?s+"?o="+l:s;d.getElementsByTagName("head")[0].appendChild(g);}();
    </script>

    <style>
        /* ---------- ریست و پایه ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Vazir', 'Tahoma', 'Segoe UI', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            padding: 1.5rem;
            margin: 0;
            position: relative;
        }

        /* ---------- ویدئوی پس‌زمینه ---------- */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            opacity: 0.85;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.35);
            z-index: 1;
            pointer-events: none;
        }

        /* ---------- کانتینر اصلی ---------- */
        .main-container {
            position: relative;
            z-index: 2;
            max-width: 1000px;
            width: 100%;
            text-align: center;
            padding: 1rem 0.5rem;
            background: transparent;
        }

        /* ---------- گروه لوگو + نام تصویری (بسیار بزرگ) ---------- */
        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 2.5rem;
            animation: fadeInUp 1s ease forwards;
            opacity: 0;
            animation-delay: 0.2s;
        }

        /* لوگو — بدون دایره و بدون افکت */
        .logo-big {
            width: 220px;
            height: 220px;
            max-width: 70vw;
            max-height: 70vw;
            background: transparent;
            padding: 0;
            box-shadow: none;
            border-radius: 0;
            animation: none;
            transition: none;
        }

        .logo-big img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: transparent;
            filter: none;
        }

        /* نام سایت (تصویر) — بسیار بزرگ */
        .site-name-img {
            margin-top: 1.5rem;
            max-width: 550px;
            width: 100%;
            display: inline-block;
            background: transparent;
            padding: 0;
            border: none;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.05));
        }

        .site-name-img img {
            width: 100%;
            height: auto;
            display: block;
            background: transparent;
        }

        /* خط جداکننده */
        .divider {
            width: 140px;
            height: 2px;
            margin: 2rem auto 2.2rem;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.4), transparent);
            border-radius: 100%;
            animation: expandDivider 3s ease-in-out infinite alternate;
        }

        @keyframes expandDivider {
            0% { width: 100px; opacity: 0.4; }
            100% { width: 240px; opacity: 1; }
        }

        /* ---------- متن‌ها (همه سفید) ---------- */
        .message-box {
            margin: 1.5rem 0 1rem;
            animation: fadeInUp 1.2s ease forwards;
            opacity: 0;
            animation-delay: 0.5s;
        }

        .main-text {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.7;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.1), 0 0 60px rgba(0, 0, 0, 0.3);
            word-break: break-word;
            background: none;
            -webkit-text-fill-color: #ffffff;
        }

        .sub-text {
            margin-top: 1.5rem;
            font-size: 1.5rem;
            color: #ffffff;
            letter-spacing: 2px;
            font-weight: 300;
            display: inline-block;
            padding: 0.6rem 1.8rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            animation: fadeInUp 1.2s ease forwards;
            opacity: 0;
            animation-delay: 0.8s;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
        }

        .sub-text:hover {
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* ---------- فوتر با اسم توسعه‌دهنده ---------- */
        .footer-dev {
            margin-top: 3.5rem;
            padding: 0.8rem 2rem;
            font-size: 1.3rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.06);
            animation: fadeInUp 1.4s ease forwards;
            opacity: 0;
            animation-delay: 1.1s;
        }

        .footer-dev i {
            margin: 0 8px;
            opacity: 0.6;
            color: rgba(255, 255, 255, 0.5);
        }

        /* ورود از پایین */
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(35px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ---------- واکنش‌گرایی ---------- */
        @media (max-width: 650px) {
            .logo-big {
                width: 170px;
                height: 170px;
            }
            .site-name-img {
                max-width: 90vw;
                margin-top: 1.2rem;
            }
            .main-text {
                font-size: 2rem;
            }
            .sub-text {
                font-size: 1.2rem;
                padding: 0.4rem 1.2rem;
            }
            .footer-dev {
                font-size: 1rem;
                padding: 0.6rem 1.2rem;
            }
        }

        @media (max-width: 450px) {
            .logo-big {
                width: 130px;
                height: 130px;
            }
            .site-name-img {
                max-width: 85vw;
                margin-top: 1rem;
            }
            .main-text {
                font-size: 1.6rem;
            }
            .sub-text {
                font-size: 1rem;
                padding: 0.3rem 1rem;
            }
            .divider {
                width: 80px;
                margin: 1.2rem auto 1.5rem;
            }
            .footer-dev {
                font-size: 0.9rem;
                padding: 0.4rem 1rem;
            }
        }

        @media (max-width: 360px) {
            .logo-big {
                width: 100px;
                height: 100px;
            }
            .site-name-img {
                max-width: 80vw;
            }
            .main-text {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- ویدئوی پس‌زمینه -->
    <video class="bg-video" autoplay loop muted playsinline>
        <source src="https://cdn.imgurl.ir/uploads/l428279_06d4698123_minecrafts-hidden-valley-wallsflow-com.mp4" type="video/mp4" />
        مرورگر شما از ویدئو پشتیبانی نمی‌کند.
    </video>

    <!-- لایه‌ی نیمه‌شفاف -->
    <div class="overlay"></div>

    <!-- محتوای اصلی -->
    <div class="main-container">

        <!-- لوگو + نام تصویری (بسیار بزرگ) -->
        <div class="brand-section">
            <!-- لوگو بدون دایره و افکت -->
            <div class="logo-big">
                <img src="https://uploadkon.ir/uploads/f34827_26phantom-big.png" alt="لوگو سایت" />
            </div>
            <!-- نام سایت به صورت تصویر — بزرگ‌تر از قبل -->
            <div class="site-name-img">
                <img src="https://uploadkon.ir/uploads/334c27_26phantom-bgb2.png" alt="نام سایت" />
            </div>
        </div>

        <!-- خط جداکننده -->
        <div class="divider"></div>

        <!-- پیام اصلی -->
        <div class="message-box">
            <div class="main-text">
                سایت جهت انجام بروزرسانی<br />از دسترس خارج شده است
            </div>
            <div class="sub-text">
                <i class="fas fa-sync-alt" style="margin-left: 10px; opacity: 0.7;"></i>
                لطفا شکیبا باشید
                <i class="fas fa-heart" style="margin-right: 10px; opacity: 0.5; font-size: 0.9rem;"></i>
            </div>
        </div>

        <!-- فوتر: Developed By DachAshkan -->
        <div class="footer-dev">
            <i class="fas fa-code"></i>
            Developed By DachAshkan
            <i class="fas fa-rocket" style="margin-right: 8px; opacity: 0.5;"></i>
        </div>

    </div>

</body>
</html>
